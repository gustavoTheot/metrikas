services:
  postgres:
    image: postgres:16-alpine
    container_name: metrikas_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: metrikas
      POSTGRES_PASSWORD: metrikas123
      POSTGRES_DB: metrikas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrikas -d metrikas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
